[package]
name = "rig-review"
version = "0.1.0"
edition = "2024"
default-run = "rig-review"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
futures-util = "0.3"
gitlab = { version = "0.1905.0", features = ["client_pem"] }
gix = "0.89.0"
regex = "1.13.1"
reqwest = "0.13.5"
rig = { version = "0.44.0", features = ["reqwest"] }
serde = "1.0.229"
serenity = "0.12.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "registry"] }
url = "2.5.8"
